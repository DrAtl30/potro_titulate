version: '3.9'

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Montar los staticfiles y mediafiles locales para que estén disponibles en el contenedor
      - ./backend/staticfiles:/PotroTitulate/staticfiles
      - ./backend/mediafiles:/PotroTitulate/mediafiles

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      # Montar los mismos volúmenes para que nginx acceda a los archivos estáticos y media
      - ./backend/staticfiles:/staticfiles
      - ./backend/mediafiles:/mediafiles
      # Montar frontend SPA si usas
      - ./frontend/dist:/usr/share/nginx/html/frontend
      # Montar config de nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

