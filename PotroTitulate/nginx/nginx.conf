events {}

http {
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        location /api/ {
            proxy_pass http://web:8000/api/;
        }

        location /media/ {
            proxy_pass http://web:8000/media/;
        }
    }
}
