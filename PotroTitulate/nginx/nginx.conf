events {}

http {
    # Incluir tipos MIME - esto maneja CSS, JS, imágenes automáticamente
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;

        # Servir archivos estáticos directamente desde nginx
        location /static/ {
            alias /staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Para debugging temporal
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            # Servir el archivo o 404
            try_files $uri $uri/ =404;
            # Header para confirmar que nginx sirve el archivo
            add_header X-Static-Served "nginx";
        }

        # Servir archivos de media
        location /media/ {
            alias /mediafiles/;
            expires 1y;
            add_header Cache-Control "public";
            autoindex on;
            try_files $uri $uri/ =404;
        }

        # API routes - proxy a Django
        location /api/ {
            proxy_pass http://web:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin de Django
        location /admin/ {
            proxy_pass http://web:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Todo lo demás va a Django
        location / {
            proxy_pass http://web:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}