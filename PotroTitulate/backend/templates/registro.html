{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro UAEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/registro.css' %}">
</head>
<body>
    <a href="{% url 'index' %}" class="back-arrow">&larr;</a>
    <div class="registro-container">
        <div class="registro-header">
            <img src="{% static 'img/escudo positivo color vertical 2 líneas.png' %}" alt="Escudo UAEM">
        </div>
        <form id="registro-form" class="registro-form" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="apellidos" placeholder="Apellidos" required>
            </div>
            <div class="mb-3">
                <input type="text" class="form-control" id="numCuenta" placeholder="Num. Cuenta (7 dígitos)" maxlength="7" pattern="\d{7}" required>
        
            </div>
            <div class="mb-3">
                <select class="form-control" id="licenciatura" name="licenciatura" required>
                    <option value="" disabled selected>Selecciona una licenciatura</option>
                    <option value="Administracion">Administración</option>
                    <option value="Contaduria">Contaduría</option>
                    <option value="Mercadotecnia">Mercadotecnia</option>
                    <option value="Informatica_Administrativa">Informática Administrativa</option>
                </select>
            </div>
        
            

            <div class="mb-3">
                <input type="email" class="form-control" id="correo" placeholder="Correo Institucional" required>
            </div>
            <div class="mb-3">
                <div class="tooltip-container">
                    <input type="password" class="form-control" id="contrasena" placeholder="Contraseña" required>
                    <span class="tooltip-icon" id="password-tooltip">ℹ️</span>
                </div>
                <div class="password-requirements" id="password-requirements">
                    <p>La contraseña debe contener:</p>
                    <div class="requirement"><span id="length-icon" class="requirement-icon invalid">✗</span> Mínimo 8 caracteres</div>
                    <div class="requirement"><span id="uppercase-icon" class="requirement-icon invalid">✗</span> Al menos una mayúscula</div>
                    <div class="requirement"><span id="lowercase-icon" class="requirement-icon invalid">✗</span> Al menos una minúscula</div>
                    <div class="requirement"><span id="number-icon" class="requirement-icon invalid">✗</span> Al menos un número</div>
                    <div class="requirement"><span id="special-icon" class="requirement-icon invalid">✗</span> Al menos un carácter especial (!@#$%^&*)</div>
                </div>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="confirmarContrasena" placeholder="Confirmar contraseña" required>
                <div id="password-match" class="invalid">Las contraseñas no coinciden</div>
            </div>
            <div class="form-group d-flex align-items-center justify-content-between mb-3">
                <label for="periodo_ingreso" class="mb-0">Periodo de Ingreso:</label>
                <div class="custom-stepper">
                    <button type="button" class="stepper-btn" onclick="cambiarPeriodo(-1, 'ingreso')">-</button>
                    <input type="text" id="periodo_ingreso" class="stepper-input" value="2020A" readonly>
                    <button type="button" class="stepper-btn" onclick="cambiarPeriodo(1, 'ingreso')">+</button>
                </div>
            </div>

            <div class="form-group d-flex align-items-center justify-content-between mb-3">
                <label for="periodo_egreso" class="mb-0">Periodo de Egreso:</label>
                <div class="custom-stepper">
                    <button type="button" class="stepper-btn" onclick="cambiarPeriodo(-1, 'egreso')">-</button>
                    <input type="text" id="periodo_egreso" class="stepper-input" value="2020A" readonly>
                    <button type="button" class="stepper-btn" onclick="cambiarPeriodo(1, 'egreso')">+</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Registrarse</button>
        </form>
        <div class="modal" id="errorModal">
            <div class="modalContent">
                <span class="close">&times;</span>
                <p class="modalMessage"></p>
            </div>
        </div>
        <div class="modal" id="successModal">
            <div class="modalContent">
                <span class="close">&times;</span>
                <p class="modalMessage"></p>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-overlay">
            <div class="footer-text">
                <p>Universida Autonoma Del Estado de Mexico</p>
            </div>
        </div>
        <img src="{% static 'img/pleca con hexágonos LARGA.jpg' %}" alt="Imagen del pie de página">
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}?v={{ timestamp }}"></script>
</body>
</html>
