{% load static %}
<!DOCTYPE html>
<html lang = "es">

<head>
    <meta charset= "UTF-8">
    <title> Preguntas Frecuentes </title>
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <!-- Enlace a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/estilosPreFre.css' %}">  
</head>

<body>
    <!--Header -->
    <header class="header-custom">
        <div class="container text-center">     
            <img src="{% static 'img/pleca con hexágonos LARGA.jpg' %}" alt="header" class="header-logo">
        </div>
    </header>

    <!-- Principal-->
    <main class ="container main-content py-5">
        <h1 class="text-center mb-4">Preguntas Frecuentes</h1>
            <div class="accordion-scroll-container">
                <div class="accordion" id = "prefreAccordion">
                    {% for prefre in pre_freS %}
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="heading{{forloop.counter}}">
                                <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#prefre{{ forloop.counter}}">
                                    {{prefre.pregunta}}
                                </button>
                            </h2>
                            <div id="prefre{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#prefreAccordion">
                               <div class="accordion-body">
                                    {{ prefre.respuesta }}
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </main>

    <!--Footer de imagen larga-->
    <footer class="footer-custom">
        <img src="{% static 'img/pleca con hexágonos LARGA.jpg'%}" alt="Footer" class="footer-img">
    
        <div class="footer-text">
            <p class="mb-0">{% now 'Y' %} Universidad Autónoma del Estado de México</p>
        </div>
    </footer>

    <!-- Enlace a Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
