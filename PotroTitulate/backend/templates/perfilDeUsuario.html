{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/estilos2.css' %}">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/mensajes.css'%}">

    <style>
        /* Se mantienen tus estilos para las notificaciones */
        #notificaciones-container {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 350px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1050;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: .25rem;
            padding: 1rem;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
            display: none;
        }
        /* ... (resto de tus estilos) ... */
    </style>
</head>
<body>
    <a href="{% url 'index' %}" class="back-arrow">&larr;</a>

    <header>
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div class="header-left">
                <img src="{% static 'img/escudo negativo color vertical 2 líneas.png' %}" alt="Escudo UAEM">
            </div>

            <nav>
                <button id="botonMensajes" data-sustentante-id="{{ id_sustentante }}" class="btn btn-info"> Ver mensajes </button>

                <div id="zonaMensajes" class="zona-mensajes">
                    </div>

                <button id="botonToggleNotificaciones" class="btn btn-warning position-relative">
                    <i class="fas fa-bell"></i> Notificaciones
                    <span id="notificaciones-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">!</span>
                </button>

                <div class="dropdown">
                    <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown">Preguntas Frecuentes</a>
                    <div class="dropdown-menu">
                        <a href="#">Pregunta 1</a>
                        <a href="#">Pregunta 2</a>
                        <a href="#">Pregunta 3</a>
                    </div>
                </div>

                <button class="btn btn-link text-white ms-auto" style="text-decoration: none;" onclick="cerrarSesion()">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <div style="text-align: left; padding: 10px 20px; font-size: 18px; font-weight: bold;">
        Bienvenido: {{ nombre_sustentante }}
    </div>

    <div id="notificaciones-container">
        </div>

    <div id="requisitosContainer" style="margin-top: 20px;"></div>

    <input type="hidden" id="idTramite" value="{{ id_tramite }}">
    <input type="hidden" id="idSustentante" value="{{ id_sustentante }}">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

    <div id="errorModal" class="modal">
        <div class="modalContent">
            <span class="close">&times;</span>
            <p class="modalMessage"></p>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="modalContent">
            <span class="close">&times;</span>
            <p class="modalMessage"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts2.js' %}?v={{ timestamp }}"></script>
    <script src="{% static 'js/mensajes.js' %}?v={{ timestamp }}"></script>
    <script src="{% static 'js/notificaciones.js' %}?v={{ timestamp }}"></script>

    <script>
        // Función para obtener el CSRF token (útil para POST requests si los necesitas)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function obtenerIdDelSustentante() {
            const input = document.getElementById('idSustentante');
            return input ? input.value : null;
        }

        const toggleButton = document.getElementById('botonToggleNotificaciones');
        const notificacionesContainer = document.getElementById('notificaciones-container');
        if (toggleButton && notificacionesContainer) {
            toggleButton.addEventListener('click', () => {
                if (notificacionesContainer.style.display === 'none' || notificacionesContainer.style.display === '') {
                    notificacionesContainer.style.display = 'block';
                    const sustentanteId = obtenerIdDelSustentante();
                    if (sustentanteId) {
                        cargarNotificaciones(sustentanteId); // Asumo que esta función está en notificaciones.js
                    }
                } else {
                    notificacionesContainer.style.display = 'none';
                }
            });
        }

        // --- BLOQUE checkSession ELIMINADO ---
        // La protección de la página ahora la hace Django en el backend.
        // Si el usuario no está logueado, nunca verá esta página.
        
    </script>
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1055">
        <div id="toastAlerta" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    Mensaje por defecto
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</body>
</html>
