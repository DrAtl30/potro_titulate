{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/estilos2.css' %}">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/mensajes.css'%}">

    <style>
        #notificaciones-container {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 350px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1050;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: .25rem;
            padding: 1rem;
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
            display: none;
        }

        #notificaciones-container .alert {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        #notificaciones-container .alert p {
            margin-bottom: 0.25rem;
        }

        #notificaciones-container .alert small {
            font-size: 0.8rem;
        }

        #botonToggleNotificaciones {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <a href="{% url 'index' %}" class="back-arrow">&larr;</a>

    <!-- HEADER REESTRUCTURADO -->
    <header>
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <!-- Escudo -->
            <div class="header-left">
                <img src="{% static 'img/escudo positivo color vertical 2 líneas.png' %}" alt="Escudo UAEM">
            </div>

            <!-- Navegación -->
            <nav>
                <button id="botonMensajes" data-sustentante-id="{{ id_sustentante }}" class="btn btn-info"> Ver mensajes </button>

                <div id="zonaMensajes" class="zona-mensajes">
                    <div class="zona-mensajes-interno">
                        <div class="sidebar-mensajes">
                            <h5>Mensajes Recibidos</h5>
                            <ul id="listaResumenMensajes" class="lista-resumen-mensajes"></ul>
                        </div>
                        <div class="contenedor-principal-mensajes">
                            <div class="encabezado-mensajes">
                                <h3>Detalle de Mensajes</h3>
                                <button id="cerrarMensajes" class="boton-cerrar-mensajes" aria-label="Cerrar mensajes">&times;</button>
                            </div>
                            <div class="lista-mensajes-contenedor">
                                <ul id="listaMensajes" class="lista-mensajes"></ul>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="botonToggleNotificaciones" class="btn btn-warning position-relative">
                    <i class="fas fa-bell"></i> Notificaciones
                    <span id="notificaciones-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">!</span>
                </button>

                <div class="dropdown">
                    <a href="#" class="dropdown-toggle" data-bs-toggle="dropdown">Preguntas Frecuentes</a>
                    <div class="dropdown-menu">
                        <a href="#">Pregunta 1</a>
                        <a href="#">Pregunta 2</a>
                        <a href="#">Pregunta 3</a>
                    </div>
                </div>

                <button class="btn btn-link text-white ms-auto" style="text-decoration: none;" onclick="cerrarSesion()">Cerrar sesión</button>
            </nav>
        </div>
    </header>

    <!-- TEXTO DE BIENVENIDA -->
    <div style="text-align: left; padding: 10px 20px; font-size: 18px; font-weight: bold;">
        Bienvenido: {{ nombre_sustentante }}
    </div>

    <!-- Notificaciones -->
    <div id="notificaciones-container">
        <h5>Notificaciones</h5>
        <hr>
        <div id="lista-notificaciones-aqui">
            <p class="text-muted" id="no-notificaciones-msg">No tienes notificaciones nuevas.</p>
        </div>
    </div>

    <div id="requisitosContainer" style="margin-top: 20px;"></div>

    <input type="hidden" id="idTramite" value="{{ id_tramite }}">
    <input type="hidden" id="idSustentante" value="{{ id_sustentante }}">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

    <!-- Modales -->
    <div id="errorModal" class="modal">
        <div class="modalContent">
            <span class="close">&times;</span>
            <p class="modalMessage"></p>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="modalContent">
            <span class="close">&times;</span>
            <p class="modalMessage"></p>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts2.js' %}?v={{ timestamp }}"></script>
    <script src="{% static 'js/session-check.js' %}?v={{ timestamp }}"></script>
    <script src="{% static 'js/mensajes.js' %}?v={{ timestamp }}"></script>
    <script src="{% static 'js/notificaciones.js' %}?v={{ timestamp }}"></script>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function obtenerIdDelSustentante() {
            const input = document.getElementById('idSustentante');
            return input ? input.value : null;
        }

        const toggleButton = document.getElementById('botonToggleNotificaciones');
        const notificacionesContainer = document.getElementById('notificaciones-container');
        if (toggleButton && notificacionesContainer) {
            toggleButton.addEventListener('click', () => {
                if (notificacionesContainer.style.display === 'none' || notificacionesContainer.style.display === '') {
                    notificacionesContainer.style.display = 'block';
                    const sustentanteId = obtenerIdDelSustentante();
                    if (sustentanteId) {
                        cargarNotificaciones(sustentanteId);
                    }
                } else {
                    notificacionesContainer.style.display = 'none';
                }
            });
        }

        function checkSession() {
            fetch('/checkSession/')
                .then(response => response.json())
                .then(data => {
                    if (!data.is_authenticated) {
                        window.location.href = '/iniciosesion/';
                    } else {
                        const sustentanteId = obtenerIdDelSustentante();
                        if (sustentanteId) {
                            cargarNotificaciones(sustentanteId);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error al verificar la sesión:', error);
                });
        }

        document.addEventListener('DOMContentLoaded', checkSession);

        window.onpageshow = function(event) {
            if (event.persisted) {
                checkSession();
            }
        };
    </script>
</body>
</html>
