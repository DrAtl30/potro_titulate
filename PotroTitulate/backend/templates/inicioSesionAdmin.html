{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
  <style>
    /* Tus estilos existentes de la página, por ejemplo: */
    body {
      background: url('{% static "img/fondo.jpeg" %}') no-repeat center center fixed;
      background-size: cover;
    }
    .login-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-header img {
      max-width: 100px;
      margin-bottom: 10px;
    }
    .login-form .form-control {
      border-radius: 50px;
      border: 1px solid #5a7561;
    }
    .login-form button {
      width: 100%;
      background-color: #5a7561;
      color: white;
      border: none;
      border-radius: 50px;
    }
    .forgot-password {
      text-align: center;
      margin-top: 15px;
    }
    .forgot-password a {
      color: #5a7561;
      text-decoration: none;
    }
    .forgot-password a:hover {
      text-decoration: underline;
    }
    .back-arrow {
      font-size: 24px;
      color: #5a7561;
      text-decoration: none;
      position: absolute;
      top: 20px;
      left: 20px;
    }
    .back-arrow:hover {
      text-decoration: underline;
    }
    footer {
      position: relative;
      background-color: #6e7b68;
      text-align: center;
      margin-top: auto;
      height: 10vh;
      display: flex;
      justify-content: center;
    }
    footer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- Estilos para el Modal --- */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none; /* Se mostrará cuando se asigne display: flex desde JS */
      align-items: center;
      justify-content: center;
      background-color: rgba(0,0,0,0.5); /* Fondo semitransparente */
      z-index: 9999; /* Asegura que esté por encima de otros elementos */
    }
    .modalContent {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      max-height: 80%;
      overflow-y: auto;
      position: relative;
    }
    .modalContent .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
    }
    .modalMessage {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <a href="{% url 'index' %}" class="back-arrow">&larr;</a>
  <div class="login-container">
    <div class="login-header">
      <img src="{% static 'img/escudo positivo color vertical 2 líneas.png' %}" alt="Escudo UAEM">
    </div>
    <!-- Importante: No se especifica action para que el formulario no se envíe por GET -->
    <form id="admin-login-form" class="login-form">
      {% csrf_token %}
      <div class="mb-3">
        <input type="email" class="form-control" id="correo" name="correo_electronico" placeholder="Correo Electrónico" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      <div class="forgot-password">
        <a href="{% url 'recuperarContrasena' %}">¿Olvidaste tu contraseña?</a>
      </div>
    </form>        
  </div>
  <footer>
    <img src="{% static 'img/pleca con hexágonos LARGA.jpg' %}" alt="Imagen del pie de página">
  </footer>
