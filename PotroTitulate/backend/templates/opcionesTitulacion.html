        let opcionSeleccionadaGlobal = null;
        
function showRequirementsOP(opcion) {
    opcionSeleccionadaGlobal = opcion; // Almacenar la opción seleccionada
    document.getElementById('opcionSeleccionada').textContent = `Opción seleccionada: ${opcion}`;
    const requisitosContainer = document.getElementById("requisitosContainer");
    const listaRequisitos = document.getElementById("listaRequisitos");

    // Limpiar la lista de requisitos previos
    listaRequisitos.innerHTML = "";

    // Obtener los requisitos para la opción seleccionada
    const requisitos = requisitosPorOpcion[opcion] || ["No hay requisitos definidos para esta opción."];

    // Llenar la lista con los requisitos
    requisitos.forEach(requisito => {
        const li = document.createElement('li');
        li.textContent = requisito;
        listaRequisitos.appendChild(li);
    });

    // Mostrar el contenedor de requisitos
    requisitosContainer.style.display = "block";
}

function obtenerIdOpcionSeleccionada() {
    if (opcionSeleccionadaGlobal) {
        const idOpcion = opcionesConId[opcionSeleccionadaGlobal];
        if (idOpcion) {
            return idOpcion;
        } else {
            console.log("Opción no válida");
            return null;
        }
    } else {
        console.log("No se ha seleccionado ninguna opción.");
        return null;
    }
}

function enviarSolicitud() {
    const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
    const idSustentanteInput = document.getElementById("idSustentante");
    const idOpcion = obtenerIdOpcionSeleccionada(); // Obtener el ID de la opción seleccionada

    console.log("ID de la opción seleccionada:", idOpcion); // Verificar el ID de la opción seleccionada

    if (!idOpcion) {
        mostrarAlerta('⚠️ Selecciona una opción de titulación válida.', 'warning');
        return;
    }

    const idSustentante = idSustentanteInput ? idSustentanteInput.value : "";

    fetch('/api/enviarSolicitud/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({
            id_sustentante: idSustentante,
            id_opcion: idOpcion  // Agregamos id_opcion al cuerpo de la solicitud
        })
    })
    .then(response => {
        console.log("Estado de la respuesta:", response.status);
        if (response.ok) {
            mostrarAlerta('✅ Solicitud enviada con éxito.', 'success');
            setTimeout(() => {
                window.location.href = '/perfilUsuario/';
            }, 2000);
        } else {
            mostrarAlerta('❌ Error al enviar la solicitud.', 'danger');
        }
    })
    .catch(error => {
        console.error('Error al enviar la solicitud:', error);
    });
}

    
    function mostrarAlerta(mensaje, tipo = "success", duracion = 5000) {
        const toastEl = document.getElementById("toastAlerta");
        const toastBody = toastEl.querySelector(".toast-body");

        // Cambiar color de fondo según el tipo
        toastEl.className = `toast align-items-center text-white bg-${tipo} border-0`;

        // Mensaje
        toastBody.textContent = mensaje;

        // Mostrar
        const toast = new bootstrap.Toast(toastEl, { delay: duracion });
        toast.show();
    }
